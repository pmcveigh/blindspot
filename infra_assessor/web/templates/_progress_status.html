<div id="assessment-progress"
     hx-get="/assessments/{{ assessment.id }}/progress"
     hx-trigger="every 2s"
     hx-target="this"
     hx-swap="outerHTML">
  <span class="status {{ assessment.status }}">{{ assessment.status }}</span>
  <div class="progress"><i></i></div>
  <p><b>Assessment level:</b> {{ assessment.assessment_level|replace("_", " ")|title }}</p><p><b>Current stage:</b> {{ assessment.stage }}</p>
</div>
