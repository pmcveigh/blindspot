{% extends "base.html" %}{% block content %}<h1>New assessment</h1><div class="card form-card"><p class="notice"><b>Authorised networks only.</b> v0.1.2 accepts canonical RFC1918 IPv4 networks and never scans an arbitrary Internet target.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/assessments"><label>Customer name<input name="customer_name" maxlength="200" required value="{{ customer_name or '' }}"></label><label>Authorised IPv4 subnet<input name="target_cidr" placeholder="192.168.1.0/24" required value="{{ target_cidr or '' }}"><small>Accepted ranges: 10/8, 172.16/12 and 192.168/16.</small></label><label class="check"><input type="checkbox" name="authorised" value="yes" required> I confirm that I am authorised to assess this network.</label><button>Start assessment</button></form></div>{% endblock %}
