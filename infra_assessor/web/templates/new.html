{% extends "base.html" %}{% block content %}<h1>New assessment</h1><div class="card form-card"><p class="notice"><b>Authorised networks only.</b> v0.1.3 accepts canonical RFC1918 IPv4 networks and never scans an arbitrary Internet target.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/assessments"><label>Customer name<input name="customer_name" maxlength="200" required value="{{ customer_name or '' }}"></label><label>Authorised IPv4 subnet<input name="target_cidr" placeholder="192.168.1.0/24" required value="{{ target_cidr or '' }}"><small>Accepted ranges: 10/8, 172.16/12 and 192.168/16.</small></label><label>Assessment level<select name="assessment_level"><option value="discovery" {% if assessment_level == 'discovery' %}selected{% endif %}>Discovery</option><option value="active_identification" {% if assessment_level not in ['discovery','security_validation'] %}selected{% endif %}>Active Identification (recommended)</option><option value="security_validation" {% if assessment_level == 'security_validation' %}selected{% endif %}>Security Validation</option></select><small><b>Security Validation:</b> Actively interacts with discovered services, performs protocol negotiation and runs bounded security checks. Does not modify data, brute-force credentials, exploit vulnerabilities or intentionally disrupt services.</small></label><label class="check"><input type="checkbox" name="authorised" value="yes" required> I confirm that I am authorised to assess this network.</label><button>Start assessment</button></form></div>{% endblock %}
