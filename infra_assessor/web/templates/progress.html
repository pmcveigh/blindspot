{% extends "base.html" %}{% block content %}<div hx-get="/assessments/{{ assessment.id }}" hx-trigger="every 3s" hx-select="main" hx-target="main" hx-swap="outerHTML"><h1>Assessment in progress</h1><div class="card"><span class="status {{ assessment.status }}">{{ assessment.status }}</span><h2>{{ assessment.customer_name }}</h2><p><code>{{ assessment.target_cidr }}</code></p><div class="progress"><i></i></div><p><b>Current stage:</b> {{ assessment.stage }}</p><p>Discovered hosts are stored after Nmap safely completes and validates its XML output.</p><form method="post" action="/assessments/{{ assessment.id }}/cancel"><button class="secondary">Cancel scan</button></form></div></div>{% endblock %}
