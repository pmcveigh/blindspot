{% extends "base.html" %}{% block content %}<h1>Assessment in progress</h1><div class="card"><h2>{{ assessment.customer_name }}</h2><p><code>{{ assessment.target_cidr }}</code></p>{% include "_progress_status.html" %}<p id="poll-message" class="muted" aria-live="polite"></p><p>Discovered hosts are stored after Nmap safely completes and validates its XML output.</p><p><a href="/assessments/{{ assessment.id }}">Refresh status</a></p><form method="post" action="/assessments/{{ assessment.id }}/cancel"><button class="secondary">Cancel scan</button></form></div><script>document.body.addEventListener('htmx:responseError',function(e){if(e.detail.elt.id==='assessment-progress'){document.getElementById('poll-message').textContent='Status update unavailable; retrying automatically.';}});document.body.addEventListener('htmx:afterRequest',function(e){if(e.detail.successful&&e.detail.elt.id==='assessment-progress'){document.getElementById('poll-message').textContent='';}});</script>{% endblock %}
