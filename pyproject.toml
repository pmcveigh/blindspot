[project]
name = "infra-assessor"
version = "0.1.0"
description = "Safe, local network infrastructure assessments for authorised pre-sales use"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115", "jinja2>=3.1", "pydantic>=2.10", "python-multipart>=0.0.18",
  "pyyaml>=6.0", "sqlalchemy>=2.0", "uvicorn>=0.34", "playwright>=1.49"
]

[project.scripts]
infra-assessor = "infra_assessor.app.main:run"

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=1.14", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra_assessor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

